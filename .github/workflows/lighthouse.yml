name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build site
        run: npm run build
        env:
          NODE_ENV: production

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli
          lhci autorun
        continue-on-error: true

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: lighthouse-results
          path: .lighthouseci
          retention-days: 30

      - name: Format Lighthouse summary
        if: always()
        run: |
          echo "## 🏠 Lighthouse Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f ".lighthouseci/manifest.json" ]; then
            echo "✅ Lighthouse audit completed successfully!" >> $GITHUB_STEP_SUMMARY
            echo "📊 View detailed reports in the artifacts." >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Lighthouse audit encountered issues." >> $GITHUB_STEP_SUMMARY
          fi
