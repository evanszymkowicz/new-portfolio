name: Preview Deployment

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # 👇 ADD THIS STEP HERE (after dependencies, before build)
      - name: Cache Wrangler
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-wrangler-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-wrangler-

      - name: Build Gatsby site
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy Preview to Cloudflare Pages
        id: deploy
        run: |
          DEPLOYMENT_OUTPUT=$(npx wrangler pages deploy public \
            --project-name=ews-tech \
            --branch=preview-pr-${{ github.event.pull_request.number }} \
            --commit-hash="${{ github.sha }}" \
            --commit-message="Preview for PR #${{ github.event.pull_request.number }}")

          echo "$DEPLOYMENT_OUTPUT"

          # Extract the preview URL
          PREVIEW_URL=$(echo "$DEPLOYMENT_OUTPUT" | grep -oP 'https://[a-z0-9-]+\.pages\.dev' | head -1)
          echo "preview_url=$PREVIEW_URL" >> $GITHUB_OUTPUT
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment Preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = '${{ steps.deploy.outputs.preview_url }}' || 'https://ews-tech.pages.dev';

            const comment = `### 🚀 Preview Deployment Ready!  

            Your changes have been deployed to a preview environment.  

            🔗 **Preview URL**: ${previewUrl}

            This preview will be automatically updated when you push new commits to this PR. 

            ---

            📊 **Build Details**
            - Commit: \`${{ github.sha }}\`
            - Branch: \`${{ github.head_ref }}\`
            - Deployed at: ${new Date().toLocaleString()}`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
