name: Preview Deployment

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy Preview to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          DEPLOYMENT_OUTPUT=$(npx wrangler@4 pages deploy public \
            --project-name=ews-tech \
            --branch="preview-pr-$PR_NUMBER" \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="Preview for PR #$PR_NUMBER")

          echo "$DEPLOYMENT_OUTPUT"

          PREVIEW_URL=$(echo "$DEPLOYMENT_OUTPUT" | grep -oP 'https://[a-z0-9-]+\.pages\.dev' | head -1)
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Comment Preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = '${{ steps.deploy.outputs.preview_url }}' || 'https://ews-tech.pages.dev';

            const comment = `### 🚀 Preview Deployment Ready!

            Your changes have been deployed to a preview environment.

            🔗 **Preview URL**: ${previewUrl}

            This preview will be automatically updated when you push new commits to this PR.

            ---

            📊 **Build Details**
            - Commit: \`${{ github.sha }}\`
            - Branch: \`${{ github.head_ref }}\`
            - Deployed at: ${new Date().toLocaleString()}`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
